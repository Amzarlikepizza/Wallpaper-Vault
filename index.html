<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpaper Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
      <div class="header">
        <div class="header-title">
          <div class="title-block">
            <h1 class="site-title">Wallpaper Vault</h1>
            <p class="site-slogan">No Ads , Only Wallpaper</p>
          </div>
          <img src="img/folder png.png" alt="Folder icon" class="title-icon" />
        </div>

      <div class="header-actions">
        <button id="language-toggle" class="language-toggle" type="button" aria-expanded="false">Language</button>
        <button id="contribute-btn" class="contribute-btn" type="button">Contribute</button>
        <div id="language-menu" class="language-menu" role="menu">
          <button class="language-option" type="button" data-lang="en">English</button>
          <button class="language-option" type="button" data-lang="es">Español</button>
          <button class="language-option" type="button" data-lang="fr">Français</button>
          <button class="language-option" type="button" data-lang="de">Deutsch</button>
          <button class="language-option" type="button" data-lang="it">Italiano</button>
          <button class="language-option" type="button" data-lang="pt">Português</button>
          <button class="language-option" type="button" data-lang="ar">العربية</button>
          <button class="language-option" type="button" data-lang="ja">日本語</button>
          <button class="language-option" type="button" data-lang="ko">한국어</button>
          <button class="language-option" type="button" data-lang="zh">中文</button>
          <button class="language-option" type="button" data-lang="hi">हिन्दी</button>
          <button class="language-option" type="button" data-lang="tr">Türkçe</button>
          <button class="language-option" type="button" data-lang="nl">Nederlands</button>
          <button class="language-option" type="button" data-lang="ru">Русский</button>
        </div>
      </div>
    </div>

    <main class="page-content">
      <div class="intro">
        <h2>Homepage</h2>
      </div>

      <div class="view-toggle-wrapper">
        <span class="view-toggle-label">Wallpaper Type</span>
        <div class="view-toggle" role="group" aria-label="Choose wallpaper type">
          <button class="view-toggle-btn is-active" type="button" data-view="pc" aria-pressed="true">PC / Laptop</button>
          <button class="view-toggle-btn" type="button" data-view="phone" aria-pressed="false">Phone</button>
        </div>
      </div>

      <section id="wallpaper-list" class="wallpaper-list" aria-label="Wallpaper gallery"></section>
    </main>

    <!-- Contribute modal -->
    <div id="contribute-overlay" class="modal-overlay" hidden>
      <div class="contribute-modal" role="dialog" aria-modal="true" aria-labelledby="contribute-title">
        <h3 id="contribute-title">Contribute Wallpaper</h3>
        <form id="contribute-form">
          <label for="contribute-file">Choose file (JPG, PNG) — max 4 MB</label>
          <input id="contribute-file" type="file" accept="image/png, image/jpeg" required />

          <label for="contribute-type">Wallpaper type</label>
          <select id="contribute-type" required>
            <option value="pc">PC / Laptop</option>
            <option value="phone">Phone</option>
          </select>

          <label for="contribute-nickname">Your nickname</label>
          <input id="contribute-nickname" type="text" placeholder="Nickname" required />

          <div class="contribute-actions">
            <button id="contribute-submit" type="submit" class="download-btn">Upload</button>
            <button id="contribute-cancel" type="button" class="download-btn">Cancel</button>
          </div>

          <p id="contribute-message" class="contribute-message" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
